name: Client CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android Build, Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 Platform & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Targeted Unit Tests
        run: ./gradlew :core:mock:testDebugUnitTest :core:domain:testDebugUnitTest :core:datastore:testDebugUnitTest :core:data:testDebugUnitTest :core:network:testDebugUnitTest :feature:vehicle_detail:testDebugUnitTest

      - name: Assemble Environment APKs & Lint
        # Reserved non-routable fixtures validate packaging only; no hosted API is contacted.
        run: >-
          ./gradlew :composeApp:assembleDevDebug :composeApp:assembleMockDebug
          :composeApp:assembleStageDebug :composeApp:assembleProdRelease
          :composeApp:lintDevDebug :composeApp:lintMockDebug
          :composeApp:lintStageDebug :composeApp:lintProdRelease
          -Pmotopark.stage.apiBaseUrl=https://stage.example.invalid
          -Pmotopark.prod.apiBaseUrl=https://prod.example.invalid
          --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8'

      - name: Check Packaged Environment Isolation
        run: |
          python3 scripts/check-android-environments.py
          python3 scripts/check-mock-packaging.py

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*
          if-no-files-found: ignore

  ios:
    name: iOS Kotlin Simulator Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check iOS Environment Wiring
        run: python3 scripts/check-ios-environments.py

      - name: Compile Kotlin for iOS Simulator
        run: |
          ./gradlew compileKotlinIosSimulatorArm64
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 -Pmotopark.mock=true
