appId: ${APP_ID}
---
# Flow FL-07 & FL-08: Vehicle Reservation Lifecycle and Calendar Selection
# Environment: MOCK (cz.kudladev.vehicletracking.mock)

- launchApp:
    clearState: true

# 1. Login as standard user
- runFlow:
    file: "../subflows/login_as_user.yaml"

# 2. Open vehicle detail
- assertVisible:
    id: "vehicles:grid"
- assertVisible:
    id: "vehicles:item:${DEFAULT_VEHICLE_ID}"
- tapOn:
    id: "vehicles:item:${DEFAULT_VEHICLE_ID}"

# 3. Assert detail and calendar components
- assertVisible:
    id: "vehicle_detail:title"
- scrollUntilVisible:
    element:
      id: "calendar:date:2026-11-03"
    direction: DOWN
- assertVisible:
    id: "calendar:date:2026-11-03"

# 4. Select deterministic reservation dates (Mock now = 2026-11-02T08:00:00Z)
- tapOn:
    id: "calendar:date:2026-11-03"
- scrollUntilVisible:
    element:
      id: "calendar:select_start_time"
    direction: DOWN
- tapOn:
    id: "calendar:select_start_time"
- tapOn:
    text: "09:00"

- scrollUntilVisible:
    element:
      id: "calendar:date:2026-11-03"
    direction: UP
- tapOn:
    id: "calendar:date:2026-11-03"
- scrollUntilVisible:
    element:
      id: "calendar:select_end_time"
    direction: DOWN
- tapOn:
    id: "calendar:select_end_time"
- tapOn:
    text: "11:00"

# 5. Reserve vehicle
- scrollUntilVisible:
    element:
      id: "vehicle_detail:reserve_button"
    direction: DOWN
- assertVisible:
    id: "vehicle_detail:reserve_button"
- tapOn:
    id: "vehicle_detail:reserve_button"

# 6. Verify tracking screen
- assertVisible:
    id: "tracking:vehicle_header"
- assertVisible:
    id: "tracking:current_state"
- assertNotVisible:
    text: "Tracking created successfully"

# 7. Logout
- runFlow:
    file: "../subflows/logout.yaml"
